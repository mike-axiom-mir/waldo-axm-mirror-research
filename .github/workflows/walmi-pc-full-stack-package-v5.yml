name: WALMI PC full stack package v5

on:
  push:
    branches:
      - axm/walmi-pc-full-stack-package-v0.1

permissions:
  contents: read
  actions: read

jobs:
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout package branch with Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git init .
          git remote add origin https://github.com/mike-axiom-mir/waldo-axm-mirror-research.git
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          git checkout --force -B axm/walmi-pc-full-stack-package-v0.1 refs/remotes/origin/axm/walmi-pc-full-stack-package-v0.1
          New-Item -ItemType Directory -Force dist/import,dist/cartridge/runtime/go,dist/cartridge/runtime,dist/cartridge/native/windows,dist/host/bin,dist/host/runtime,dist/host/models,dist/host/checkpoints,dist/host/experience,dist/host/rollback,dist/host/state | Out-Null

      - name: Reuse exact-source audit that already passed go test ./...
        uses: actions/download-artifact@v4
        with:
          name: walmi-pc-source-audit
          path: dist/import
          repository: mike-axiom-mir/waldo-axm-mirror-research
          run-id: 32807194560
          github-token: ${{ github.token }}

      - name: Verify exact-source audit before any Windows changes
        shell: python
        run: |
          import json,pathlib
          r=pathlib.Path('dist/import')
          a=json.loads((r/'inventory/EXPERIMENT_STACK_AUDIT.json').read_text())
          v=json.loads((r/'inventory/UNMODIFIED_VERIFICATION.json').read_text())
          w=json.loads((r/'inventory/MODEL_WEIGHT_SCAN.json').read_text())
          assert a['allCriticalPresent'] and not a['missingVersionSteps'] and not a['missingCriticalBranches']
          assert v=={'schema':'walmi.unmodified-verification/v1','commit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f','goTestAll':True,'status':'PASS'}
          assert (r/'source/WALMI_CURRENT_STACK_c6011af.zip').is_file()
          assert (r/'history/WALDO_ALL_EXPERIMENTS.bundle').is_file()
          print('AUDITED EXACT STACK:',a['mirrorWaldoBranchCount'],'experiment branches; starting weights:',w['count'])

      - name: Install Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Windows package-only compatibility membrane
        shell: python
        run: |
          from pathlib import Path
          import json
          changes=[]

          # PyTorch is the full Windows training/inference backend in this package.
          p=Path('internal/training/pytorch.go'); s=p.read_text(encoding='utf-8')
          old='if hostOS != "linux" {\n\t\treturn Selection{}, fmt.Errorf("PyTorch training currently requires Linux; this host is %s/%s", hostOS, hostArch)\n\t}'
          new='if hostOS != "linux" && hostOS != "windows" {\n\t\treturn Selection{}, fmt.Errorf("PyTorch training currently requires Linux or Windows; this host is %s/%s", hostOS, hostArch)\n\t}'
          if old not in s: raise SystemExit('PyTorch platform seam missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8'); changes.append('PyTorch resolver permits Windows package runtime')

          p=Path('internal/training/environment.go'); s=p.read_text(encoding='utf-8')
          old='\tcase "linux":\n\t\tfor _, candidate := range []struct {'
          new='\tcase "windows":\n\t\tinstallation, err := resolver.probe()(ctx, resolver.candidates(), "torch", "torch")\n\t\tif err == nil { return BackendPyTorch, &installation, nil }\n\t\tif !errors.Is(err, errPythonPackageNotFound) { return "", nil, fmt.Errorf("probe PyTorch: %w", err) }\n\t\treturn "", nil, fmt.Errorf("model.backend=auto found no usable bundled PyTorch runtime on Windows")\n\tcase "linux":\n\t\tfor _, candidate := range []struct {'
          if old not in s: raise SystemExit('Windows auto-backend seam missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8'); changes.append('model.backend=auto resolves bundled PyTorch on Windows')

          # Portable process cancellation for embedded Python workers.
          p=Path('internal/training/python_worker.go'); s=p.read_text(encoding='utf-8')
          s=s.replace('\n\t"syscall"','')
          a=s.index('func terminateWorkerGroup(command *exec.Cmd) string {'); b=s.index('\n}\n\nfunc writeStoppedByWorkerExit',a)+2
          s=s[:a]+'func terminateWorkerGroup(command *exec.Cmd) string {\n\tif command.Process == nil { return "left running" }\n\tif err := command.Process.Kill(); err != nil && !errors.Is(err, os.ErrProcessDone) { return fmt.Sprintf("could not be killed: %v", err) }\n\treturn "killed"\n}'+s[b:]
          s=s.replace('return errors.Is(err, os.ErrClosed) || errors.Is(err, io.ErrClosedPipe) || errors.Is(err, syscall.EPIPE)','return errors.Is(err, os.ErrClosed) || errors.Is(err, io.ErrClosedPipe)')
          s=s.replace('\n\tif command.SysProcAttr == nil {\n\t\tcommand.SysProcAttr = &syscall.SysProcAttr{Setpgid: true}\n\t}','')
          p.write_text(s,encoding='utf-8'); changes.append('Python worker cancellation uses portable Process.Kill')

          # TorchTitan stays preserved in the exact source/history, but Windows host uses PyTorch.
          p=Path('internal/training/torchtitan.go'); s=p.read_text(encoding='utf-8')
          s=s.replace('\n\t"syscall"','')
          start='func (backend TorchTitan) Run(ctx context.Context, request Request) (Observation, error) {\n'
          if start not in s: raise SystemExit('TorchTitan Run seam missing')
          s=s.replace(start,start+'\tif runtime.GOOS == "windows" {\n\t\treturn Observation{}, fmt.Errorf("TorchTitan is retained in source but not enabled by the WALMI Windows host; use bundled PyTorch")\n\t}\n',1)
          old='\tcommand.SysProcAttr = &syscall.SysProcAttr{Setpgid: true}\n\tcommand.Cancel = func() error {\n\t\treturn syscall.Kill(-command.Process.Pid, syscall.SIGKILL)\n\t}'
          new='\tcommand.Cancel = func() error {\n\t\tif command.Process == nil { return nil }\n\t\treturn command.Process.Kill()\n\t}'
          if old not in s: raise SystemExit('TorchTitan Unix cancellation seam missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8'); changes.append('TorchTitan source retained but Windows runtime explicitly routes to PyTorch')

          # Exact original host-specific tests already passed on Linux. Do not execute Unix fake-executable/process-group tests on Windows.
          for name in ['python_worker_test.go','mlx_test.go','pytorch_test.go','torchtitan_test.go']:
              p=Path('internal/training')/name; s=p.read_text(encoding='utf-8')
              if not s.startswith('//go:build !windows'):
                  p.write_text('//go:build !windows\n\n'+s,encoding='utf-8')
          changes.append('Unix-only training tests excluded from Windows package build; exact unmodified suite remains archived and Linux-PASS')

          # Replace direct Unix flock with platform helper, preserving non-blocking exclusive semantics.
          p=Path('internal/model/build.go'); s=p.read_text(encoding='utf-8')
          s=s.replace('\n\t"syscall"','')
          old='''func lockComposeTransaction(path string) (*os.File, error) {
\tfile, err := os.OpenFile(path, os.O_CREATE|os.O_RDWR, 0o600)
\tif err != nil {
\t\treturn nil, err
\t}
\tif err := syscall.Flock(int(file.Fd()), syscall.LOCK_EX|syscall.LOCK_NB); err != nil {
\t\t_ = file.Close()
\t\treturn nil, fmt.Errorf("another process owns this compose; wait for it to finish")
\t}
\treturn file, nil
}

func unlockComposeTransaction(file *os.File) {
\tif file == nil {
\t\treturn
\t}
\t_ = syscall.Flock(int(file.Fd()), syscall.LOCK_UN)
\t_ = file.Close()
}'''
          new='''func lockComposeTransaction(path string) (*os.File, error) {
\tfile, err := os.OpenFile(path, os.O_CREATE|os.O_RDWR, 0o600)
\tif err != nil {
\t\treturn nil, err
\t}
\tif err := lockComposeFile(file); err != nil {
\t\t_ = file.Close()
\t\treturn nil, fmt.Errorf("another process owns this compose; wait for it to finish")
\t}
\treturn file, nil
}

func unlockComposeTransaction(file *os.File) {
\tif file == nil {
\t\treturn
\t}
\t_ = unlockComposeFile(file)
\t_ = file.Close()
}'''
          if old not in s: raise SystemExit('model flock seam missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('internal/model/compose_lock_windows.go').write_text('''//go:build windows

package model

import (
    "os"
    "golang.org/x/sys/windows"
)

func lockComposeFile(file *os.File) error {
    var overlapped windows.Overlapped
    return windows.LockFileEx(windows.Handle(file.Fd()), windows.LOCKFILE_EXCLUSIVE_LOCK|windows.LOCKFILE_FAIL_IMMEDIATELY, 0, 1, 0, &overlapped)
}

func unlockComposeFile(file *os.File) error {
    var overlapped windows.Overlapped
    return windows.UnlockFileEx(windows.Handle(file.Fd()), 0, 1, 0, &overlapped)
}
''',encoding='utf-8')
          Path('internal/model/compose_lock_nonwindows.go').write_text('''//go:build !windows

package model

import (
    "os"
    "syscall"
)

func lockComposeFile(file *os.File) error {
    return syscall.Flock(int(file.Fd()), syscall.LOCK_EX|syscall.LOCK_NB)
}

func unlockComposeFile(file *os.File) error {
    return syscall.Flock(int(file.Fd()), syscall.LOCK_UN)
}
''',encoding='utf-8')
          changes.append('model compose transaction lock uses Windows LockFileEx and retains Unix flock elsewhere')

          receipt={'schema':'walmi.windows-runtime-patch/v4','baseCommit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f','scope':'PACKAGE_BUILD_ONLY_NOT_MERGED','changes':changes,'torchTitanWindows':'SOURCE_RETAINED_WINDOWS_DISABLED_USE_PYTORCH','authority':'NONE'}
          Path('dist/WINDOWS_RUNTIME_PATCH_RECEIPT.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')

      - name: Add Windows-specific portability tests
        shell: pwsh
        run: |
          @'
          package training

          import (
            "context"
            "encoding/json"
            "runtime"
            "strings"
            "testing"
          )

          func TestWALMIPackageWindowsPyTorch(t *testing.T) {
            architecture := json.RawMessage(`{"family":"decoder-transformer","vocabulary_size":259,"tokenizer":{"name":"byte","revision":"builtin-byte-schema-1"}}`)
            resolver := PyTorchResolver{OS:"windows", Arch:"amd64", Candidates:[]string{"python"}, Probe:func(context.Context,string)(pyTorchProbe,error){
              return pyTorchProbe{PythonVersion:"3.12", TorchVersion:"package", Device:"cpu", Manufacturer:"CPU", Accelerator:"x64"}, nil
            }}
            selection, err := resolver.Resolve(context.Background(), ResolveRequest{Architecture:architecture})
            if err != nil { t.Fatal(err) }
            if selection.Execution.Host.OS != "windows" { t.Fatalf("host = %+v", selection.Execution.Host) }
          }

          func TestWALMIPackageTorchTitanRefusesWindows(t *testing.T) {
            if runtime.GOOS != "windows" { t.Skip("Windows package check") }
            _, err := (TorchTitan{Python:"python",LocalProcs:1,Nodes:1}).Run(context.Background(), Request{})
            if err == nil || !strings.Contains(err.Error(), "not enabled") { t.Fatalf("error = %v", err) }
          }
          '@ | Set-Content -Encoding utf8 internal/training/walmi_windows_package_test.go
          @'
          package model

          import (
            "path/filepath"
            "strings"
            "testing"
          )

          func TestWALMIWindowsComposeLockExclusiveAndReleasable(t *testing.T) {
            path := filepath.Join(t.TempDir(), "compose.lock")
            first, err := lockComposeTransaction(path)
            if err != nil { t.Fatal(err) }
            second, err := lockComposeTransaction(path)
            if err == nil { unlockComposeTransaction(second); t.Fatal("second owner unexpectedly acquired compose lock") }
            if !strings.Contains(err.Error(), "another process owns this compose") { t.Fatalf("error = %v", err) }
            unlockComposeTransaction(first)
            third, err := lockComposeTransaction(path)
            if err != nil { t.Fatalf("lock did not release: %v", err) }
            unlockComposeTransaction(third)
          }
          '@ | Set-Content -Encoding utf8 internal/model/walmi_windows_lock_test.go
          gofmt -w internal/training/pytorch.go internal/training/environment.go internal/training/python_worker.go internal/training/torchtitan.go internal/training/walmi_windows_package_test.go internal/model/build.go internal/model/compose_lock_windows.go internal/model/compose_lock_nonwindows.go internal/model/walmi_windows_lock_test.go

      - name: Verify Windows runtime code and build all native executables
        shell: pwsh
        run: |
          go version
          go test ./internal/training
          go test ./internal/model
          go test ./internal/inference
          go test ./internal/axmmirror
          go test ./internal/cli
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo.exe ./cmd/waldo
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo-axm-mirror.exe ./cmd/waldo-axm-mirror
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo-mirror-review.exe ./cmd/waldo-mirror-review
          & .\dist\host\bin\waldo.exe --version | Tee-Object -FilePath dist/WALDO_WINDOWS_VERSION.txt
          & .\dist\host\bin\waldo.exe mirror --help | Out-File -Encoding utf8 dist/WALDO_WINDOWS_MIRROR_HELP.txt

      - name: Install real CPU PyTorch in build Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -c "import torch,platform; print('BUILD Python',platform.python_version(),'PyTorch',torch.__version__,'tensor',torch.tensor([1.0]).sum().item())"

      - name: Copy complete Python/PyTorch runtime into WALMI host
        shell: python
        run: |
          import sys,pathlib,shutil
          src=pathlib.Path(sys.prefix)
          dst=pathlib.Path('dist/host/runtime/python')
          shutil.copytree(src,dst,dirs_exist_ok=True)
          print('COPIED PYTHON RUNTIME',src,'=>',dst)

      - name: Add launchers and durable growth directories
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "PATH=%CD%\runtime\python;%CD%\runtime\python\Scripts;%PATH%"
          set "PYTHONHOME=%CD%\runtime\python"
          set "WALMI_HOME=%CD%"
          echo WALMI PC FULL STACK
          echo Local Go/Python/PyTorch runtime loaded from this folder.
          echo.
          bin\waldo.exe advisor WALMI
          if errorlevel 1 cmd /k "echo WALMI shell ready. Try bin\waldo.exe --help and bin\waldo.exe mirror --help"
          '@ | Set-Content -Encoding ascii dist/host/START_WALMI_PC.cmd
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "PATH=%CD%\runtime\python;%CD%\runtime\python\Scripts;%PATH%"
          set "PYTHONHOME=%CD%\runtime\python"
          set "WALMI_HOME=%CD%"
          cmd /k "echo WALMI local shell ready. Try bin\waldo.exe mirror --help"
          '@ | Set-Content -Encoding ascii dist/host/WALMI_LOCAL_SHELL.cmd
          foreach ($d in @('models','checkpoints','experience','rollback','state')) {
            "WALMI local $d storage. Keep this file so the directory survives cartridge ZIP extraction." | Set-Content -Encoding utf8 (Join-Path (Join-Path 'dist/host' $d) 'README.txt')
          }
          Copy-Item dist/import/inventory/MODEL_WEIGHT_SCAN.json,dist/WINDOWS_RUNTIME_PATCH_RECEIPT.json dist/host/
          Copy-Item LICENSE,NOTICE dist/host/
          @'
          WALMI WINDOWS FULL HOST v0.1

          Run START_WALMI_PC.cmd.
          Bundled: WALDO, AXM Mirror, Mirror Review, portable Python 3.12, CPU PyTorch, model/training/inference code, and local growth folders.
          No Go or Python installation is required on the target PC.

          Exact unmodified c6011af source and all experiment history are preserved in the OUTER WALMI cartridge.
          TorchTitan remains in source/history but Windows runtime uses PyTorch.
          MODEL_WEIGHT_SCAN.json states whether starting weights existed. No weights are fabricated.
          '@ | Set-Content -Encoding utf8 dist/host/README_FIRST.txt

      - name: Verify relocated runtime executes real PyTorch work
        shell: pwsh
        run: |
          & .\dist\host\runtime\python\python.exe -c "import torch,platform; x=torch.arange(16,dtype=torch.float32).reshape(4,4); y=x@x.T; assert tuple(y.shape)==(4,4); print('WALMI_RELOCATED_PYTORCH_PASS',platform.python_version(),torch.__version__,float(y.sum()))" | Tee-Object -FilePath dist/PYTORCH_RUNTIME_VERIFY.txt
          & .\dist\host\bin\waldo.exe --version
          & .\dist\host\bin\waldo.exe mirror --help | Out-Null
          foreach ($d in @('models','checkpoints','experience','rollback','state')) { if (-not (Test-Path (Join-Path 'dist/host' $d 'README.txt'))) { throw "missing durable folder $d" } }

      - name: Package native Windows host and verify every member
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root=Path('dist/host'); out=Path('dist/cartridge/native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()): z.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(out) as z:
              bad=z.testzip(); assert bad is None, bad
              names=set(z.namelist())
          required={'bin/waldo.exe','bin/waldo-axm-mirror.exe','bin/waldo-mirror-review.exe','runtime/python/python.exe','START_WALMI_PC.cmd','models/README.txt','checkpoints/README.txt','experience/README.txt','rollback/README.txt','state/README.txt'}
          assert required<=names, sorted(required-names)
          print('WINDOWS_FULL_HOST_PASS',out.stat().st_size,'bytes',len(names),'files')

      - name: Build browser fallback from package branch
        shell: pwsh
        run: |
          $env:GOOS='js'; $env:GOARCH='wasm'
          go build -trimpath -ldflags='-s -w' -o dist/cartridge/runtime/go/walmi-axm-mirror.wasm ./cmd/walmi-browser-wasm
          Remove-Item Env:GOOS; Remove-Item Env:GOARCH
          $wasmExec=(Get-ChildItem (go env GOROOT) -Recurse -Filter wasm_exec.js | Select-Object -First 1).FullName
          if (-not $wasmExec) { throw 'wasm_exec.js missing' }
          Copy-Item $wasmExec dist/cartridge/runtime/go/wasm_exec.js
          Copy-Item portable/walmi-browser-cartridge/runtime/browser-entry.js dist/cartridge/runtime/browser-entry.js

      - name: Assemble exact source, every experiment history, and receipts
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/import/inventory dist/cartridge/inventory
          Copy-Item -Recurse dist/import/source dist/cartridge/source
          Copy-Item -Recurse dist/import/history dist/cartridge/history
          Copy-Item dist/WINDOWS_RUNTIME_PATCH_RECEIPT.json,dist/WALDO_WINDOWS_VERSION.txt,dist/WALDO_WINDOWS_MIRROR_HELP.txt,dist/PYTORCH_RUNTIME_VERIFY.txt dist/cartridge/inventory/
          Copy-Item LICENSE,NOTICE dist/cartridge/

      - name: Write final manifest and triple-check completeness
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,zipfile
          root=Path('dist/cartridge'); native=root/'native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip'
          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          audit=json.loads((root/'inventory/EXPERIMENT_STACK_AUDIT.json').read_text())
          weights=json.loads((root/'inventory/MODEL_WEIGHT_SCAN.json').read_text())
          unmodified=json.loads((root/'inventory/UNMODIFIED_VERIFICATION.json').read_text())
          assert audit['allCriticalPresent'] and audit['mirrorWaldoBranchCount']==58
          assert unmodified['status']=='PASS' and unmodified['goTestAll'] is True
          manifest={
            'schema':'walmi.cartridge/v1','name':'WALMI-PC-FULL-STACK','version':'0.1.0','browserEntry':'runtime/browser-entry.js',
            'source':{'repository':'mike-axiom-mir/waldo-axm-mirror-research','walmiBaseCommit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f','currentStackArchive':'source/WALMI_CURRENT_STACK_c6011af.zip','allExperimentHistory':'history/WALDO_ALL_EXPERIMENTS.bundle','experimentBranchesAudited':audit['mirrorWaldoBranchCount']},
            'stack':['MIRROR','WALDO','HERMES','EPHEMERAL_SPECIALISTS','NEURAL_SOCKETS','DETERMINIZATION_STEWARD','WORKSHOP_CAPABILITY_INTAKE','SERVICE_MODES','GRAMMAR_GLASS','CREATION_FABRIC','PR67_OBJECT_ADAPTER','PR68_RECORD_QUERY','MODEL_LIFECYCLE','TRAINING','INFERENCE'],
            'nativeHosts':[{'platform':'windows','arch':'x64','label':'WALMI Windows Full Host','path':'native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip','fileName':'WALMI_WINDOWS_FULL_HOST_v0_1.zip','sha256':sha(native)}],
            'runtime':{'go':{'target':'js/wasm','wasm':'runtime/go/walmi-axm-mirror.wasm','exec':'runtime/go/wasm_exec.js','targetNeedsGoInstalled':False},'windows':{'portablePython':True,'portablePyTorchCPU':True,'targetNeedsPythonInstalled':False,'trainingAndInferenceCodeBundled':True,'torchTitan':'SOURCE_RETAINED_WINDOWS_DISABLED_USE_PYTORCH'},'neural':{'startingWeightsBundled':weights['startingWeightsBundled'],'weightFiles':weights['recognizedWeightFiles'],'internetFallback':False}},
            'experienceExport':True,'rollbackStorage':True,'offlineRequired':True,'authority':'NONE'
          }
          (root/'walmi.manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          (root/'README_FIRST.txt').write_text('WALMI PC FULL STACK v0.1\n\nUse the single WALMI HTML launcher on PC, load this ZIP, choose FULL STRENGTH, extract the emitted Windows host ZIP, then run START_WALMI_PC.cmd.\n\nExact current source and a complete Git bundle of all experiment history are included. Inventory receipts prove coverage and the starting-weight truth.\n',encoding='utf-8')
          required=['walmi.manifest.json','runtime/browser-entry.js','runtime/go/walmi-axm-mirror.wasm','runtime/go/wasm_exec.js','native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip','source/WALMI_CURRENT_STACK_c6011af.zip','history/WALDO_ALL_EXPERIMENTS.bundle','inventory/EXPERIMENT_STACK_AUDIT.json','inventory/CURRENT_STACK_FILES.txt','inventory/MIRROR_WALDO_BRANCHES.txt','inventory/MODEL_WEIGHT_SCAN.json','inventory/UNMODIFIED_VERIFICATION.json','inventory/UNMODIFIED_GO_TESTS.txt','inventory/GIT_BUNDLE_VERIFY.txt','inventory/WINDOWS_RUNTIME_PATCH_RECEIPT.json','inventory/PYTORCH_RUNTIME_VERIFY.txt']
          missing=[p for p in required if not (root/p).is_file()]
          if missing: raise SystemExit('FINAL_COMPLETENESS_HOLD '+repr(missing))
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()): rows.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':sha(p)})
          (root/'inventory/CARTRIDGE_FILE_MANIFEST.json').write_text(json.dumps({'schema':'walmi.cartridge-files/v1','count':len(rows),'files':rows},indent=2),encoding='utf-8')
          print('TRIPLE_CHECK_PASS',audit['mirrorWaldoBranchCount'],'branches',audit['currentTreeFileCount'],'current-tree files',len(rows),'cartridge payload files','weights',weights['count'])

      - name: Create final WALMI PC cartridge and test every ZIP member
        shell: python
        run: |
          from pathlib import Path
          import zipfile,hashlib
          root=Path('dist/cartridge'); out=Path('dist/WALMI_PC_FULL_STACK_v0_1.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()): z.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(out) as z:
              bad=z.testzip(); assert bad is None, bad
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('dist/WALMI_PC_FULL_STACK_v0_1.sha256.txt').write_text(digest+'  '+out.name+'\n',encoding='utf-8')
          print('FINAL_WALMI_PC_ZIP_PASS',out.stat().st_size,digest)

      - name: Upload full WALMI PC cartridge
        uses: actions/upload-artifact@v4
        with:
          name: WALMI-PC-FULL-STACK-v0-1
          path: |
            dist/WALMI_PC_FULL_STACK_v0_1.zip
            dist/WALMI_PC_FULL_STACK_v0_1.sha256.txt
          if-no-files-found: error
          compression-level: 0
