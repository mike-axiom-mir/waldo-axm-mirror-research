name: AXM v0.11 Organ runtime witness

on:
  pull_request:
    paths:
      - 'internal/axmmirror/organ_runtime_bridge.go'
      - 'internal/axmmirror/organ_runtime_bridge_test.go'
      - 'internal/axmmirror/testdata/organ-runtime-bridge-v0.11.json'
      - 'internal/axmmirror/conversation_continuity.go'
      - 'internal/axmmirror/conversation_continuity_test.go'
      - 'research/v0.11-organ-fabric/**'
      - 'docs/adr/9013-axm-waldo-organ-fabric-runtime-bridge.md'
      - '.github/workflows/axm-v011-organ-runtime.yml'

permissions:
  contents: write

jobs:
  organ-runtime-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: One-time exact continuity gofmt repair
        run: |
          gofmt -w internal/axmmirror/conversation_continuity.go internal/axmmirror/conversation_continuity_test.go
          if ! git diff --quiet -- internal/axmmirror/conversation_continuity.go internal/axmmirror/conversation_continuity_test.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/axmmirror/conversation_continuity.go internal/axmmirror/conversation_continuity_test.go
            git commit -m 'style: gofmt AXM continuity witnesses' -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Repository format check
        run: test -z "$(gofmt -l .)"
      - name: Focused witness tests
        run: go test ./internal/axmmirror -run 'TestOrganRuntimeBridge' -count=1
