name: AXM v0.11 Organ runtime witness

on:
  pull_request:
    paths:
      - 'internal/axmmirror/organ_runtime_bridge.go'
      - 'internal/axmmirror/organ_runtime_bridge_test.go'
      - 'internal/axmmirror/testdata/organ-runtime-bridge-v0.11.json'
      - 'internal/axmmirror/conversation_continuity.go'
      - 'internal/axmmirror/conversation_continuity_test.go'
      - 'research/v0.11-organ-fabric/**'
      - 'docs/adr/9013-axm-waldo-organ-fabric-runtime-bridge.md'
      - '.github/workflows/axm-v011-organ-runtime.yml'

jobs:
  organ-runtime-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Global format inventory
        run: |
          echo 'gofmt inventory:'
          gofmt -l .
      - name: Prepare continuity format repair artifact
        run: |
          mkdir -p .axm-format-repair/internal/axmmirror
          cp internal/axmmirror/conversation_continuity.go .axm-format-repair/internal/axmmirror/
          cp internal/axmmirror/conversation_continuity_test.go .axm-format-repair/internal/axmmirror/
          gofmt -w .axm-format-repair/internal/axmmirror/*.go
      - name: Upload continuity format repair artifact
        uses: actions/upload-artifact@v4
        with:
          name: v011-continuity-gofmt-repair
          path: .axm-format-repair/internal/axmmirror/*.go
          if-no-files-found: error
      - name: Format check
        run: test -z "$(gofmt -l internal/axmmirror/organ_runtime_bridge.go internal/axmmirror/organ_runtime_bridge_test.go)"
      - name: Focused witness tests
        run: go test ./internal/axmmirror -run 'TestOrganRuntimeBridge' -count=1
