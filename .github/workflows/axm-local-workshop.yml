name: AXM local workshop gate

on:
  push:
    branches:
      - axm/local-ai-workshop-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  workshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply Go formatting
        run: |
          gofmt -w cmd/workshop
          if ! git diff --quiet -- cmd/workshop; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/workshop
            git commit -m "style(workshop): gofmt"
            git push
          fi
      - name: Vet
        run: go vet ./cmd/workshop
      - name: Test
        run: go test ./cmd/workshop
      - name: Shell syntax
        run: bash -n cmd/workshop/install-autostart.sh cmd/workshop/uninstall-autostart.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @('cmd/workshop/install-autostart.ps1', 'cmd/workshop/uninstall-autostart.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
