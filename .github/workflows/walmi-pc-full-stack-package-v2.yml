name: WALMI PC full stack package v2

on:
  push:
    branches:
      - axm/walmi-pc-full-stack-package-v0.1

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Manual long-path checkout of every branch
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git init .
          git remote add origin https://github.com/mike-axiom-mir/waldo-axm-mirror-research.git
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          git checkout --force -B axm/walmi-pc-full-stack-package-v0.1 refs/remotes/origin/axm/walmi-pc-full-stack-package-v0.1
          git status --short
          New-Item -ItemType Directory -Force dist/inventory,dist/history,dist/source,dist/cartridge/runtime/go,dist/cartridge/runtime,dist/cartridge/native/windows,dist/host/bin,dist/host/runtime,dist/host/models,dist/host/checkpoints,dist/host/experience,dist/host/rollback,dist/host/state | Out-Null

      - name: Triple-check all Mirror-WALDO experiments and archive history
        shell: python
        run: |
          import subprocess,json,pathlib,sys
          lines=subprocess.check_output(['git','for-each-ref','--format=%(refname:short) %(objectname)','refs/remotes/origin/axm/mirror-waldo*'],text=True).splitlines()
          refs={a.replace('origin/','',1):b for a,b in (x.split(None,1) for x in lines if x.strip())}
          missing=[]
          for n in range(1,55):
              p=f'axm/mirror-waldo-experiment-v0.{n}'
              if not any(k==p or k.startswith(p+'-') for k in refs): missing.append(f'v0.{n}')
          critical=['axm/mirror-waldo-experiment-v0.51-ephemeral-specialist-pools','axm/mirror-waldo-experiment-v0.51-website-creation-loop','axm/mirror-waldo-experiment-v0.52-neural-connection-sockets','axm/mirror-waldo-experiment-v0.53-determinization-steward','axm/mirror-waldo-experiment-v0.54-workshop-capability-intake','axm/mirror-waldo-service-modes-sidecar-v0.54','axm/mirror-waldo-capability-intake-pr68-sidecar']
          absent=[x for x in critical if x not in refs]
          audit={'schema':'walmi.pc-experiment-stack-audit/v1','baseCommit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f','branchCount':len(refs),'missingVersionSteps':missing,'missingCriticalBranches':absent,'allCriticalPresent':not missing and not absent,'branches':refs}
          pathlib.Path('dist/inventory/EXPERIMENT_STACK_AUDIT.json').write_text(json.dumps(audit,indent=2),encoding='utf-8')
          pathlib.Path('dist/inventory/MIRROR_WALDO_BRANCHES.txt').write_text('\n'.join(f'{k} {v}' for k,v in sorted(refs.items()))+'\n',encoding='utf-8')
          files=subprocess.check_output(['git','ls-tree','-r','--name-only','c6011afbb456b8fe1e6c7c6eda7857aec681cb8f'],text=True).splitlines()
          pathlib.Path('dist/inventory/CURRENT_STACK_FILES.txt').write_text('\n'.join(files)+'\n',encoding='utf-8')
          weights=[p for p in files if pathlib.PurePosixPath(p).suffix.lower() in {'.safetensors','.pt','.pth','.ckpt','.gguf','.onnx','.npz'}]
          pathlib.Path('dist/inventory/MODEL_WEIGHT_SCAN.json').write_text(json.dumps({'schema':'walmi.model-weight-scan/v1','commit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f','recognizedWeightFiles':weights,'count':len(weights),'startingWeightsBundled':bool(weights)},indent=2),encoding='utf-8')
          if missing or absent: raise SystemExit(json.dumps(audit,indent=2))
          print('AUDIT PASS',len(refs),'branches, v0.1..v0.54 covered, weights',len(weights))
      - name: Archive exact current tree and every Git ref
        shell: pwsh
        run: |
          git archive --format=zip --output=dist/source/WALMI_CURRENT_STACK_c6011af.zip c6011afbb456b8fe1e6c7c6eda7857aec681cb8f
          git bundle create dist/history/WALDO_ALL_EXPERIMENTS.bundle --all
          git bundle verify dist/history/WALDO_ALL_EXPERIMENTS.bundle

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify untouched cumulative stack first
        shell: pwsh
        run: |
          go test ./internal/axmmirror
          go test ./internal/model
          go test ./internal/training
          go test ./internal/inference

      - name: Patch only packaged Windows runtime boundary
        shell: python
        run: |
          from pathlib import Path
          p=Path('internal/training/pytorch.go'); s=p.read_text()
          s=s.replace('if hostOS != "linux" {\n\t\treturn Selection{}, fmt.Errorf("PyTorch training currently requires Linux; this host is %s/%s", hostOS, hostArch)\n\t}','if hostOS != "linux" && hostOS != "windows" {\n\t\treturn Selection{}, fmt.Errorf("PyTorch training currently requires Linux or Windows; this host is %s/%s", hostOS, hostArch)\n\t}',1); p.write_text(s)
          p=Path('internal/training/environment.go'); s=p.read_text()
          needle='\tcase "linux":\n\t\tfor _, candidate := range []struct {'
          repl='\tcase "windows":\n\t\tinstallation, err := resolver.probe()(ctx, resolver.candidates(), "torch", "torch")\n\t\tif err == nil { return BackendPyTorch, &installation, nil }\n\t\tif !errors.Is(err, errPythonPackageNotFound) { return "", nil, fmt.Errorf("probe PyTorch: %w", err) }\n\t\treturn "", nil, fmt.Errorf("model.backend=auto found no usable bundled PyTorch runtime on Windows")\n\tcase "linux":\n\t\tfor _, candidate := range []struct {'
          if needle not in s: raise SystemExit('environment patch seam missing')
          p.write_text(s.replace(needle,repl,1))
          p=Path('internal/training/python_worker.go'); s=p.read_text()
          s=s.replace('\n\t"syscall"','')
          a=s.index('func terminateWorkerGroup(command *exec.Cmd) string {'); b=s.index('\n}\n\nfunc writeStoppedByWorkerExit',a)+2
          s=s[:a]+'func terminateWorkerGroup(command *exec.Cmd) string {\n\tif command.Process == nil { return "left running" }\n\tif err := command.Process.Kill(); err != nil && !errors.Is(err, os.ErrProcessDone) { return fmt.Sprintf("could not be killed: %v", err) }\n\treturn "killed"\n}'+s[b:]
          s=s.replace('return errors.Is(err, os.ErrClosed) || errors.Is(err, io.ErrClosedPipe) || errors.Is(err, syscall.EPIPE)','return errors.Is(err, os.ErrClosed) || errors.Is(err, io.ErrClosedPipe)')
          s=s.replace('\n\tif command.SysProcAttr == nil {\n\t\tcommand.SysProcAttr = &syscall.SysProcAttr{Setpgid: true}\n\t}','')
          p.write_text(s)
          Path('dist/inventory/WINDOWS_RUNTIME_PATCH_RECEIPT.json').write_text(json.dumps({'schema':'walmi.windows-runtime-patch/v1','baseCommit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f','scope':'PACKAGE_BUILD_ONLY_NOT_MERGED','changes':['PyTorch Windows resolver','Windows auto PyTorch','portable worker termination']},indent=2),encoding='utf-8')

      - name: Add package-only Windows resolver test
        shell: pwsh
        run: |
          @'
          package training
          import ("context";"encoding/json";"testing")
          func TestWALMIPackageWindowsPyTorch(t *testing.T){
            a:=json.RawMessage(`{"family":"decoder-transformer","vocabulary_size":259,"tokenizer":{"name":"byte","revision":"builtin-byte-schema-1"}}`)
            r:=PyTorchResolver{OS:"windows",Arch:"amd64",Candidates:[]string{"python"},Probe:func(context.Context,string)(pyTorchProbe,error){return pyTorchProbe{PythonVersion:"3.12",TorchVersion:"x",Device:"cpu",Manufacturer:"CPU",Accelerator:"x64"},nil}}
            s,e:=r.Resolve(context.Background(),ResolveRequest{Architecture:a});if e!=nil{t.Fatal(e)};if s.Execution.Host.OS!="windows"{t.Fatalf("%+v",s.Execution.Host)}
          }
          '@ | Set-Content -Encoding utf8 internal/training/walmi_windows_package_test.go
          gofmt -w internal/training/*.go
          go test ./internal/training
          go test ./internal/inference
          go test ./internal/model
          go test ./internal/axmmirror

      - name: Build native Windows executables
        shell: pwsh
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo.exe ./cmd/waldo
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo-axm-mirror.exe ./cmd/waldo-axm-mirror
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo-mirror-review.exe ./cmd/waldo-mirror-review
          dist/host/bin/waldo.exe --help | Out-File -Encoding utf8 dist/inventory/WALDO_WINDOWS_HELP.txt

      - name: Bundle portable Python and real CPU PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          @'
          import sys,pathlib,shutil
          shutil.copytree(pathlib.Path(sys.prefix),pathlib.Path('dist/host/runtime/python'),dirs_exist_ok=True)
          '@ | python
          dist/host/runtime/python/python.exe -c "import torch,platform; print(platform.python_version(),torch.__version__,torch.tensor([1.0]).sum().item())"

      - name: Add portable launchers and receipts
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "PATH=%CD%\runtime\python;%CD%\runtime\python\Scripts;%PATH%"
          set "PYTHONHOME=%CD%\runtime\python"
          set "WALMI_HOME=%CD%"
          echo WALMI PC FULL STACK
          echo No Go or Python install required.
          bin\waldo.exe advisor WALMI
          if errorlevel 1 cmd /k "echo WALMI local shell ready. Try bin\waldo.exe --help"
          '@ | Set-Content -Encoding ascii dist/host/START_WALMI_PC.cmd
          @'
          @echo off
          cd /d "%~dp0"
          set "PATH=%CD%\runtime\python;%CD%\runtime\python\Scripts;%PATH%"
          set "PYTHONHOME=%CD%\runtime\python"
          cmd /k "echo WALMI local shell ready. Try bin\waldo.exe mirror --help"
          '@ | Set-Content -Encoding ascii dist/host/WALMI_LOCAL_SHELL.cmd
          Copy-Item dist/inventory/MODEL_WEIGHT_SCAN.json,dist/inventory/WINDOWS_RUNTIME_PATCH_RECEIPT.json dist/host/
          Copy-Item LICENSE,NOTICE dist/host/
          @'
          WALMI PC FULL STACK v0.1
          Run START_WALMI_PC.cmd.
          This host contains WALDO, AXM Mirror, Mirror review, model/training/inference code, portable Python 3.12 and CPU PyTorch.
          Models/checkpoints/experience/rollback/state are writable local folders.
          See MODEL_WEIGHT_SCAN.json: no starting weights are invented if the source repo contains none.
          '@ | Set-Content -Encoding utf8 dist/host/README_FIRST.txt
          dist/host/runtime/python/python.exe -c "import torch; assert torch.tensor([2.0]).sum().item()==2.0"
          dist/host/bin/waldo.exe --version
          dist/host/bin/waldo.exe mirror --help | Out-Null

      - name: Package native host
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          r=Path('dist/host');o=Path('dist/cartridge/native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip')
          with zipfile.ZipFile(o,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(x for x in r.rglob('*') if x.is_file()):z.write(p,p.relative_to(r).as_posix())
          print('native host',o.stat().st_size)

      - name: Build browser fallback and assemble full cartridge
        shell: pwsh
        run: |
          $env:GOOS='js';$env:GOARCH='wasm'
          go build -trimpath -ldflags='-s -w' -o dist/cartridge/runtime/go/walmi-axm-mirror.wasm ./cmd/walmi-browser-wasm
          Remove-Item Env:GOOS;Remove-Item Env:GOARCH
          $x=(Get-ChildItem (go env GOROOT) -Recurse -Filter wasm_exec.js|Select-Object -First 1).FullName
          Copy-Item $x dist/cartridge/runtime/go/wasm_exec.js
          Copy-Item portable/walmi-browser-cartridge/runtime/browser-entry.js dist/cartridge/runtime/browser-entry.js
          Copy-Item -Recurse dist/inventory dist/cartridge/inventory
          Copy-Item -Recurse dist/source dist/cartridge/source
          Copy-Item -Recurse dist/history dist/cartridge/history
          Copy-Item LICENSE,NOTICE dist/cartridge/

      - name: Write manifest and final completeness receipts
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,zipfile
          r=Path('dist/cartridge');n=r/'native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip'
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          w=json.loads((r/'inventory/MODEL_WEIGHT_SCAN.json').read_text())
          m={'schema':'walmi.cartridge/v1','name':'WALMI-PC-FULL-STACK','version':'0.1.0','browserEntry':'runtime/browser-entry.js','source':{'repository':'mike-axiom-mir/waldo-axm-mirror-research','walmiBaseCommit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f','currentStackArchive':'source/WALMI_CURRENT_STACK_c6011af.zip','allExperimentHistory':'history/WALDO_ALL_EXPERIMENTS.bundle'},'stack':['MIRROR','WALDO','HERMES','EPHEMERAL_SPECIALISTS','NEURAL_SOCKETS','DETERMINIZATION_STEWARD','WORKSHOP_CAPABILITY_INTAKE','SERVICE_MODES','PR67_OBJECT_ADAPTER','PR68_RECORD_QUERY'],'nativeHosts':[{'platform':'windows','arch':'x64','label':'WALMI Windows Full Host','path':'native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip','fileName':'WALMI_WINDOWS_FULL_HOST_v0_1.zip','sha256':sha(n)}],'runtime':{'go':{'target':'js/wasm','targetNeedsGoInstalled':False},'windows':{'portablePython':True,'portablePyTorchCPU':True,'targetNeedsPythonInstalled':False,'trainingAndInferenceCodeBundled':True},'neural':{'startingWeightsBundled':w['startingWeightsBundled'],'weightFiles':w['recognizedWeightFiles'],'internetFallback':False}},'experienceExport':True,'rollbackStorage':True,'offlineRequired':True,'authority':'NONE'}
          (r/'walmi.manifest.json').write_text(json.dumps(m,indent=2),encoding='utf-8')
          rows=[]
          for p in sorted(x for x in r.rglob('*') if x.is_file()):rows.append({'path':p.relative_to(r).as_posix(),'bytes':p.stat().st_size,'sha256':sha(p)})
          (r/'inventory/CARTRIDGE_FILE_MANIFEST.json').write_text(json.dumps({'schema':'walmi.cartridge-files/v1','count':len(rows),'files':rows},indent=2),encoding='utf-8')
          a=json.loads((r/'inventory/EXPERIMENT_STACK_AUDIT.json').read_text());assert a['allCriticalPresent']
          required=['walmi.manifest.json','runtime/browser-entry.js','runtime/go/walmi-axm-mirror.wasm','runtime/go/wasm_exec.js','native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip','source/WALMI_CURRENT_STACK_c6011af.zip','history/WALDO_ALL_EXPERIMENTS.bundle']
          assert all((r/p).is_file() for p in required)
          print('FINAL AUDIT PASS',len(rows),'files')

      - name: Create and test final WALMI PC ZIP
        shell: python
        run: |
          from pathlib import Path
          import zipfile,hashlib
          r=Path('dist/cartridge');o=Path('dist/WALMI_PC_FULL_STACK_v0_1.zip')
          with zipfile.ZipFile(o,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(x for x in r.rglob('*') if x.is_file()):z.write(p,p.relative_to(r).as_posix())
          with zipfile.ZipFile(o) as z:
            assert z.testzip() is None
          h=hashlib.sha256(o.read_bytes()).hexdigest();Path('dist/WALMI_PC_FULL_STACK_v0_1.sha256.txt').write_text(h+'  '+o.name+'\n')
          print(o,o.stat().st_size,h)

      - uses: actions/upload-artifact@v4
        with:
          name: WALMI-PC-FULL-STACK-v0-1
          path: |
            dist/WALMI_PC_FULL_STACK_v0_1.zip
            dist/WALMI_PC_FULL_STACK_v0_1.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
