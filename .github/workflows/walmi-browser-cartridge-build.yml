name: WALMI browser cartridge build

on:
  push:
    branches:
      - axm/walmi-browser-cartridge-build-v0.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact Go toolchain from module
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify AXM Mirror package before browser build
        shell: bash
        run: |
          set -euo pipefail
          go version
          go test ./internal/axmmirror

      - name: Compile Go AXM Mirror to browser WASM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/cartridge/runtime/go dist/cartridge/runtime dist/cartridge/source
          GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o dist/cartridge/runtime/go/walmi-axm-mirror.wasm ./cmd/walmi-browser-wasm
          WASM_EXEC="$(find "$(go env GOROOT)" -type f -name wasm_exec.js | head -n 1)"
          test -n "$WASM_EXEC"
          cp "$WASM_EXEC" dist/cartridge/runtime/go/wasm_exec.js
          cp portable/walmi-browser-cartridge/runtime/browser-entry.js dist/cartridge/runtime/browser-entry.js
          cp portable/walmi-browser-cartridge/README.md dist/cartridge/README.md
          cp LICENSE NOTICE dist/cartridge/
          cp go.mod go.sum dist/cartridge/source/
          git archive --format=tar.gz --output=dist/cartridge/source/waldo-source.tar.gz HEAD

      - name: Write cartridge manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          WASM_SHA="$(sha256sum dist/cartridge/runtime/go/walmi-axm-mirror.wasm | awk '{print $1}')"
          EXEC_SHA="$(sha256sum dist/cartridge/runtime/go/wasm_exec.js | awk '{print $1}')"
          SOURCE_SHA="$(sha256sum dist/cartridge/source/waldo-source.tar.gz | awk '{print $1}')"
          cat > dist/cartridge/walmi.manifest.json <<EOF
          {
            "schema": "walmi.cartridge/v1",
            "name": "WALMI-AXM-MIRROR-BROWSER",
            "version": "0.1.0",
            "browserEntry": "runtime/browser-entry.js",
            "source": {
              "repository": "mike-axiom-mir/waldo-axm-mirror-research",
              "walmiBaseCommit": "c6011afbb456b8fe1e6c7c6eda7857aec681cb8f",
              "cartridgeBuildCommit": "${GITHUB_SHA}",
              "archive": "source/waldo-source.tar.gz",
              "archiveSha256": "${SOURCE_SHA}"
            },
            "runtime": {
              "go": {
                "target": "js/wasm",
                "wasm": "runtime/go/walmi-axm-mirror.wasm",
                "wasmSha256": "${WASM_SHA}",
                "exec": "runtime/go/wasm_exec.js",
                "execSha256": "${EXEC_SHA}",
                "targetNeedsGoInstalled": false
              },
              "neural": {
                "state": "HELD_BROWSER_NEURAL_ENGINE_NOT_BUNDLED",
                "weightsBundled": false,
                "internetFallback": false,
                "existingDesktopBackendsRetainedInSource": ["PYTORCH_PROCESS", "MLX_PROCESS"]
              }
            },
            "stack": ["MIRROR", "WALDO", "HERMES"],
            "experienceExport": true,
            "offlineRequired": true,
            "authority": "NONE"
          }
          EOF
          (cd dist/cartridge && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Create WALMI cartridge ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('dist/cartridge')
          out = Path('dist/WALMI_AXM_MIRROR_BROWSER_CARTRIDGE_v0_1.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  z.write(path, path.relative_to(root).as_posix())
          print(out, out.stat().st_size)
          PY
          unzip -t dist/WALMI_AXM_MIRROR_BROWSER_CARTRIDGE_v0_1.zip
          sha256sum dist/WALMI_AXM_MIRROR_BROWSER_CARTRIDGE_v0_1.zip

      - name: Upload portable cartridge
        uses: actions/upload-artifact@v4
        with:
          name: walmi-axm-mirror-browser-cartridge-v0-1
          path: dist/WALMI_AXM_MIRROR_BROWSER_CARTRIDGE_v0_1.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
