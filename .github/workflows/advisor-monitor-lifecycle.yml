name: advisor monitor lifecycle regression

on:
  push:
    branches:
      - automation/state-architect-advisor-monitor-lifecycle-20260911

permissions:
  contents: read

jobs:
  focused:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l internal/cli/advisor.go internal/cli/advisor_checkpoint_monitor_test.go)"
      - name: Lifecycle regressions
        run: go test ./internal/cli -run '^TestAdvisorCheckpointMonitor(CloseIsIdempotent|RejectsObservationAfterClose)$' -count=1
