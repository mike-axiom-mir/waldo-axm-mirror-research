name: WALMI PC full stack package v6

on:
  push:
    branches:
      - axm/walmi-pc-full-stack-package-v0.1

permissions:
  contents: read
  actions: read

jobs:
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout with Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git init .
          git remote add origin https://github.com/mike-axiom-mir/waldo-axm-mirror-research.git
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          git checkout --force -B axm/walmi-pc-full-stack-package-v0.1 refs/remotes/origin/axm/walmi-pc-full-stack-package-v0.1
          New-Item -ItemType Directory -Force dist/import,dist/cartridge/runtime/go,dist/cartridge/runtime,dist/cartridge/native/windows,dist/host/bin,dist/host/runtime | Out-Null

      - name: Download exact-source audit
        uses: actions/download-artifact@v4
        with:
          name: walmi-pc-source-audit
          path: dist/import
          repository: mike-axiom-mir/waldo-axm-mirror-research
          run-id: 32807194560
          github-token: ${{ github.token }}

      - name: Verify exact-source receipts
        shell: python
        run: |
          import json,pathlib
          root=pathlib.Path('dist/import')
          audit=json.loads((root/'inventory/EXPERIMENT_STACK_AUDIT.json').read_text())
          verify=json.loads((root/'inventory/UNMODIFIED_VERIFICATION.json').read_text())
          weights=json.loads((root/'inventory/MODEL_WEIGHT_SCAN.json').read_text())
          assert audit['allCriticalPresent'] and audit['mirrorWaldoBranchCount']==58
          assert verify['status']=='PASS' and verify['goTestAll'] is True
          assert verify['commit']=='c6011afbb456b8fe1e6c7c6eda7857aec681cb8f'
          assert (root/'source/WALMI_CURRENT_STACK_c6011af.zip').is_file()
          assert (root/'history/WALDO_ALL_EXPERIMENTS.bundle').is_file()
          print('EXACT_SOURCE_RECEIPTS_PASS',audit['mirrorWaldoBranchCount'],'branches',audit['currentTreeFileCount'],'files','weights',weights['count'])

      - name: Install Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply package-only Windows membrane
        shell: pwsh
        run: |
          python portable/walmi-pc-package/patch_windows_runtime.py
          gofmt -w internal/training/pytorch.go internal/training/environment.go internal/training/python_worker.go internal/training/torchtitan.go internal/training/walmi_windows_package_test.go internal/model/build.go internal/model/compose_lock_windows.go internal/model/compose_lock_nonwindows.go internal/model/walmi_windows_lock_test.go
          Get-Content dist/WINDOWS_RUNTIME_PATCH_RECEIPT.json

      - name: Test Windows runtime and build native executables
        shell: pwsh
        run: |
          go version
          go test ./internal/training
          go test ./internal/model
          go test ./internal/inference
          go test ./internal/axmmirror
          go test ./internal/cli
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo.exe ./cmd/waldo
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo-axm-mirror.exe ./cmd/waldo-axm-mirror
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo-mirror-review.exe ./cmd/waldo-mirror-review
          & .\dist\host\bin\waldo.exe --version | Tee-Object -FilePath dist/WALDO_WINDOWS_VERSION.txt
          & .\dist\host\bin\waldo.exe mirror --help | Out-File -Encoding utf8 dist/WALDO_WINDOWS_MIRROR_HELP.txt

      - name: Install CPU PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -c "import torch,platform; print('BUILD_PYTORCH_PASS',platform.python_version(),torch.__version__)"

      - name: Copy Python and PyTorch into WALMI
        shell: python
        run: |
          import pathlib,shutil,sys
          src=pathlib.Path(sys.prefix)
          dst=pathlib.Path('dist/host/runtime/python')
          shutil.copytree(src,dst,dirs_exist_ok=True)
          print('PYTHON_RUNTIME_COPIED',src,dst)

      - name: Write WALMI host layout
        shell: pwsh
        run: |
          python portable/walmi-pc-package/write_host_layout.py

      - name: Verify relocated PyTorch can update and save weights
        shell: pwsh
        run: |
          & .\dist\host\runtime\python\python.exe -c "import json,pathlib,torch; torch.manual_seed(7); m=torch.nn.Linear(4,2); opt=torch.optim.SGD(m.parameters(),lr=0.1); x=torch.arange(12,dtype=torch.float32).reshape(3,4)/10; target=torch.zeros((3,2)); before=m.weight.detach().clone(); loss=torch.nn.functional.mse_loss(m(x),target); loss.backward(); opt.step(); changed=not torch.equal(before,m.weight.detach()); assert changed; out=pathlib.Path('dist/host/state/PACKAGE_TRAINING_SMOKE.pt'); torch.save({'state_dict':m.state_dict(),'verification_only':True},out); print('WALMI_RELOCATED_TRAINING_PASS','weight_changed',changed,'loss',float(loss),'checkpoint_bytes',out.stat().st_size)" | Tee-Object -FilePath dist/PYTORCH_RUNTIME_VERIFY.txt
          & .\dist\host\bin\waldo.exe --version
          & .\dist\host\bin\waldo.exe mirror --help | Out-Null

      - name: Package and verify native Windows host
        shell: pwsh
        run: |
          python portable/walmi-pc-package/finalize_cartridge.py native

      - name: Build browser fallback
        shell: pwsh
        run: |
          $env:GOOS='js'
          $env:GOARCH='wasm'
          go build -trimpath -ldflags='-s -w' -o dist/cartridge/runtime/go/walmi-axm-mirror.wasm ./cmd/walmi-browser-wasm
          Remove-Item Env:GOOS
          Remove-Item Env:GOARCH
          $wasmExec=(Get-ChildItem (go env GOROOT) -Recurse -Filter wasm_exec.js | Select-Object -First 1).FullName
          if (-not $wasmExec) { throw 'wasm_exec.js missing' }
          Copy-Item $wasmExec dist/cartridge/runtime/go/wasm_exec.js
          Copy-Item portable/walmi-browser-cartridge/runtime/browser-entry.js dist/cartridge/runtime/browser-entry.js

      - name: Assemble audited source and receipts
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/import/inventory dist/cartridge/inventory
          Copy-Item -Recurse dist/import/source dist/cartridge/source
          Copy-Item -Recurse dist/import/history dist/cartridge/history
          Copy-Item dist/WINDOWS_RUNTIME_PATCH_RECEIPT.json dist/cartridge/inventory/
          Copy-Item dist/WALDO_WINDOWS_VERSION.txt dist/cartridge/inventory/
          Copy-Item dist/WALDO_WINDOWS_MIRROR_HELP.txt dist/cartridge/inventory/
          Copy-Item dist/PYTORCH_RUNTIME_VERIFY.txt dist/cartridge/inventory/
          Copy-Item LICENSE dist/cartridge/
          Copy-Item NOTICE dist/cartridge/

      - name: Final triple check and final ZIP
        shell: pwsh
        run: |
          python portable/walmi-pc-package/finalize_cartridge.py final
          Get-Content dist/WALMI_PC_FULL_STACK_v0_1.sha256.txt

      - name: Upload WALMI PC full stack
        uses: actions/upload-artifact@v4
        with:
          name: WALMI-PC-FULL-STACK-v0-1
          path: |
            dist/WALMI_PC_FULL_STACK_v0_1.zip
            dist/WALMI_PC_FULL_STACK_v0_1.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
