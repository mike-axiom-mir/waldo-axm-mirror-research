name: WALMI PC full stack package v3

on:
  push:
    branches:
      - axm/walmi-pc-full-stack-package-v0.1

permissions:
  contents: read

jobs:
  audit-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and prepare audit payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          mkdir -p audit-payload/inventory audit-payload/source audit-payload/history

      - name: Triple-check experiment ladder and named stack components
        shell: python
        run: |
          import subprocess, json, pathlib, re
          base='c6011afbb456b8fe1e6c7c6eda7857aec681cb8f'
          lines=subprocess.check_output(['git','for-each-ref','--format=%(refname:short) %(objectname)','refs/remotes/origin/axm/mirror-waldo*'],text=True).splitlines()
          refs={a.replace('origin/','',1):b for a,b in (x.split(None,1) for x in lines if x.strip())}
          missing_versions=[]
          for n in range(1,55):
              prefix=f'axm/mirror-waldo-experiment-v0.{n}'
              if not any(k==prefix or k.startswith(prefix+'-') for k in refs): missing_versions.append(f'v0.{n}')
          critical=[
            'axm/mirror-waldo-experiment-v0.24',
            'axm/mirror-waldo-experiment-v0.35-live-neural-grounding-runtime',
            'axm/mirror-waldo-experiment-v0.36-real-model-ab',
            'axm/mirror-waldo-experiment-v0.38-visible-experience-spine',
            'axm/mirror-waldo-experiment-v0.42-creation-fabric-direct',
            'axm/mirror-waldo-experiment-v0.42-creation-fabric-sensory-bridge',
            'axm/mirror-waldo-experiment-v0.43-portable-capability-growth',
            'axm/mirror-waldo-experiment-v0.45-specialist-substrate',
            'axm/mirror-waldo-experiment-v0.46-portable-continuation-capsule',
            'axm/mirror-waldo-experiment-v0.47-gap-detection',
            'axm/mirror-waldo-experiment-v0.48-evidence-routing',
            'axm/mirror-waldo-experiment-v0.49-ephemeral-vision-buffer',
            'axm/mirror-waldo-experiment-v0.50-visible-planning-roadmap',
            'axm/mirror-waldo-experiment-v0.51-ephemeral-specialist-pools',
            'axm/mirror-waldo-experiment-v0.51-website-creation-loop',
            'axm/mirror-waldo-experiment-v0.52-neural-connection-sockets',
            'axm/mirror-waldo-experiment-v0.53-determinization-steward',
            'axm/mirror-waldo-experiment-v0.54-workshop-capability-intake',
            'axm/mirror-waldo-service-modes-sidecar-v0.54',
            'axm/mirror-waldo-capability-intake-pr68-sidecar'
          ]
          missing_critical=[x for x in critical if x not in refs]
          files=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          queries={
            'MIRROR':'mirror',
            'WALDO':'waldo',
            'HERMES':'hermes',
            'SPECIALISTS':'specialist',
            'NEURAL_SOCKETS':'neural-socket|neural_socket|NEURAL_A|NEURAL_B',
            'DETERMINIZATION':'determinization',
            'WORKSHOP_INTAKE':'workshop-capability-intake|waldo-workshop-integration',
            'SERVICE_MODES':'service-mode|service_mode',
            'GRAMMAR_GLASS':'grammar-glass|grammar_glass',
            'CREATION_FABRIC':'creation-fabric|creation_fabric',
            'PR67_OBJECT_ADAPTER':'closed-object-contract-adapter-v2',
            'PR68_RECORD_QUERY':'bounded-record-query-v1'
          }
          components={}
          for name,pattern in queries.items():
              p=subprocess.run(['git','grep','-IlEi',pattern,base,'--'],text=True,capture_output=True)
              paths=[x.split(':',1)[1] if ':' in x and x.split(':',1)[0]==base else x for x in p.stdout.splitlines() if x.strip()]
              components[name]={'pattern':pattern,'matchedFileCount':len(paths),'samplePaths':paths[:40]}
          core_zero=[k for k,v in components.items() if v['matchedFileCount']==0 and k not in {'HERMES'}]
          weights=[p for p in files if pathlib.PurePosixPath(p).suffix.lower() in {'.safetensors','.pt','.pth','.ckpt','.gguf','.onnx','.npz'}]
          audit={
            'schema':'walmi.pc-experiment-stack-audit/v2',
            'baseCommit':base,
            'mirrorWaldoBranchCount':len(refs),
            'missingVersionSteps':missing_versions,
            'missingCriticalBranches':missing_critical,
            'currentTreeFileCount':len(files),
            'componentEvidence':components,
            'zeroEvidenceCoreComponents':core_zero,
            'allCriticalPresent':not missing_versions and not missing_critical and not core_zero,
            'branches':refs
          }
          root=pathlib.Path('audit-payload/inventory')
          root.joinpath('EXPERIMENT_STACK_AUDIT.json').write_text(json.dumps(audit,indent=2),encoding='utf-8')
          root.joinpath('MIRROR_WALDO_BRANCHES.txt').write_text('\n'.join(f'{k} {v}' for k,v in sorted(refs.items()))+'\n',encoding='utf-8')
          root.joinpath('CURRENT_STACK_FILES.txt').write_text('\n'.join(files)+'\n',encoding='utf-8')
          root.joinpath('MODEL_WEIGHT_SCAN.json').write_text(json.dumps({'schema':'walmi.model-weight-scan/v1','commit':base,'recognizedWeightFiles':weights,'count':len(weights),'startingWeightsBundled':bool(weights),'note':'No starting weights are fabricated if count is zero.'},indent=2),encoding='utf-8')
          print('EXPERIMENT AUDIT:',len(refs),'branches; current files:',len(files),'; weights:',len(weights))
          for k,v in components.items(): print(k,v['matchedFileCount'])
          if missing_versions or missing_critical or core_zero:
              raise SystemExit(json.dumps({'missingVersionSteps':missing_versions,'missingCriticalBranches':missing_critical,'zeroEvidenceCoreComponents':core_zero},indent=2))

      - name: Archive exact cumulative tree and complete repository history
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=audit-payload/source/WALMI_CURRENT_STACK_c6011af.zip c6011afbb456b8fe1e6c7c6eda7857aec681cb8f
          git bundle create audit-payload/history/WALDO_ALL_EXPERIMENTS.bundle --all
          git bundle verify audit-payload/history/WALDO_ALL_EXPERIMENTS.bundle |& tee audit-payload/inventory/GIT_BUNDLE_VERIFY.txt

      - name: Verify exact unmodified cumulative source
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run all Go tests at c6011af
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach c6011afbb456b8fe1e6c7c6eda7857aec681cb8f
          go version | tee "$GITHUB_WORKSPACE/audit-payload/inventory/GO_VERSION.txt"
          go test ./... |& tee "$GITHUB_WORKSPACE/audit-payload/inventory/UNMODIFIED_GO_TESTS.txt"
          printf '{"schema":"walmi.unmodified-verification/v1","commit":"c6011afbb456b8fe1e6c7c6eda7857aec681cb8f","goTestAll":true,"status":"PASS"}\n' > "$GITHUB_WORKSPACE/audit-payload/inventory/UNMODIFIED_VERIFICATION.json"

      - name: Upload exact-source audit payload
        uses: actions/upload-artifact@v4
        with:
          name: walmi-pc-source-audit
          path: audit-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-windows:
    needs: audit-source
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Manual Windows checkout with long paths enabled
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git init .
          git remote add origin https://github.com/mike-axiom-mir/waldo-axm-mirror-research.git
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          git checkout --force -B axm/walmi-pc-full-stack-package-v0.1 refs/remotes/origin/axm/walmi-pc-full-stack-package-v0.1
          New-Item -ItemType Directory -Force dist/import,dist/cartridge/runtime/go,dist/cartridge/runtime,dist/cartridge/native/windows,dist/host/bin,dist/host/runtime,dist/host/models,dist/host/checkpoints,dist/host/experience,dist/host/rollback,dist/host/state | Out-Null

      - name: Download exact-source audit payload
        uses: actions/download-artifact@v4
        with:
          name: walmi-pc-source-audit
          path: dist/import

      - name: Verify audit payload before packaging
        shell: python
        run: |
          import json,pathlib
          r=pathlib.Path('dist/import')
          a=json.loads((r/'inventory/EXPERIMENT_STACK_AUDIT.json').read_text())
          v=json.loads((r/'inventory/UNMODIFIED_VERIFICATION.json').read_text())
          w=json.loads((r/'inventory/MODEL_WEIGHT_SCAN.json').read_text())
          assert a['allCriticalPresent'] and v['status']=='PASS'
          assert (r/'source/WALMI_CURRENT_STACK_c6011af.zip').is_file()
          assert (r/'history/WALDO_ALL_EXPERIMENTS.bundle').is_file()
          print('SOURCE AUDIT ACCEPTED',a['mirrorWaldoBranchCount'],'branches; weights',w['count'])

      - name: Install Go 1.25 and Python 3.12 build runtimes
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply package-only Windows runtime compatibility patch
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('internal/training/pytorch.go');s=p.read_text(encoding='utf-8')
          old='if hostOS != "linux" {\n\t\treturn Selection{}, fmt.Errorf("PyTorch training currently requires Linux; this host is %s/%s", hostOS, hostArch)\n\t}'
          new='if hostOS != "linux" && hostOS != "windows" {\n\t\treturn Selection{}, fmt.Errorf("PyTorch training currently requires Linux or Windows; this host is %s/%s", hostOS, hostArch)\n\t}'
          if old not in s: raise SystemExit('PyTorch platform gate seam missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('internal/training/environment.go');s=p.read_text(encoding='utf-8')
          old='\tcase "linux":\n\t\tfor _, candidate := range []struct {'
          new='\tcase "windows":\n\t\tinstallation, err := resolver.probe()(ctx, resolver.candidates(), "torch", "torch")\n\t\tif err == nil { return BackendPyTorch, &installation, nil }\n\t\tif !errors.Is(err, errPythonPackageNotFound) { return "", nil, fmt.Errorf("probe PyTorch: %w", err) }\n\t\treturn "", nil, fmt.Errorf("model.backend=auto found no usable bundled PyTorch runtime on Windows")\n\tcase "linux":\n\t\tfor _, candidate := range []struct {'
          if old not in s: raise SystemExit('Windows auto-backend seam missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('internal/training/python_worker.go');s=p.read_text(encoding='utf-8')
          s=s.replace('\n\t"syscall"','')
          a=s.index('func terminateWorkerGroup(command *exec.Cmd) string {');b=s.index('\n}\n\nfunc writeStoppedByWorkerExit',a)+2
          s=s[:a]+'func terminateWorkerGroup(command *exec.Cmd) string {\n\tif command.Process == nil { return "left running" }\n\tif err := command.Process.Kill(); err != nil && !errors.Is(err, os.ErrProcessDone) { return fmt.Sprintf("could not be killed: %v", err) }\n\treturn "killed"\n}'+s[b:]
          s=s.replace('return errors.Is(err, os.ErrClosed) || errors.Is(err, io.ErrClosedPipe) || errors.Is(err, syscall.EPIPE)','return errors.Is(err, os.ErrClosed) || errors.Is(err, io.ErrClosedPipe)')
          s=s.replace('\n\tif command.SysProcAttr == nil {\n\t\tcommand.SysProcAttr = &syscall.SysProcAttr{Setpgid: true}\n\t}','')
          p.write_text(s,encoding='utf-8')
          receipt={'schema':'walmi.windows-runtime-patch/v2','baseCommit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f','scope':'PACKAGE_BUILD_ONLY_NOT_MERGED','changes':['allow existing PyTorch resolver on Windows','select PyTorch for model.backend=auto on Windows','replace Unix process-group termination with portable Process.Kill'],'authority':'NONE'}
          Path('dist/WINDOWS_RUNTIME_PATCH_RECEIPT.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')

      - name: Add package-only Windows compatibility test
        shell: pwsh
        run: |
          @'
          package training

          import (
            "context"
            "encoding/json"
            "testing"
          )

          func TestWALMIPackageWindowsPyTorch(t *testing.T) {
            architecture := json.RawMessage(`{"family":"decoder-transformer","vocabulary_size":259,"tokenizer":{"name":"byte","revision":"builtin-byte-schema-1"}}`)
            resolver := PyTorchResolver{
              OS: "windows", Arch: "amd64", Candidates: []string{"python"},
              Probe: func(context.Context, string) (pyTorchProbe, error) {
                return pyTorchProbe{PythonVersion:"3.12", TorchVersion:"package", Device:"cpu", Manufacturer:"CPU", Accelerator:"x64"}, nil
              },
            }
            selection, err := resolver.Resolve(context.Background(), ResolveRequest{Architecture: architecture})
            if err != nil { t.Fatal(err) }
            if selection.Execution.Host.OS != "windows" { t.Fatalf("host = %+v", selection.Execution.Host) }
          }
          '@ | Set-Content -Encoding utf8 internal/training/walmi_windows_package_test.go
          gofmt -w internal/training/pytorch.go internal/training/environment.go internal/training/python_worker.go internal/training/walmi_windows_package_test.go

      - name: Verify Windows package boundary and build native executables
        shell: pwsh
        run: |
          go version
          go test ./internal/training
          go test ./internal/inference
          go test ./internal/model
          go test ./internal/axmmirror
          go test ./internal/cli
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo.exe ./cmd/waldo
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo-axm-mirror.exe ./cmd/waldo-axm-mirror
          go build -trimpath -ldflags='-s -w' -o dist/host/bin/waldo-mirror-review.exe ./cmd/waldo-mirror-review
          dist/host/bin/waldo.exe --version | Tee-Object -FilePath dist/WALDO_WINDOWS_VERSION.txt
          dist/host/bin/waldo.exe mirror --help | Out-File -Encoding utf8 dist/WALDO_WINDOWS_MIRROR_HELP.txt

      - name: Install and bundle real CPU PyTorch into portable Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          @'
          import sys, pathlib, shutil
          src=pathlib.Path(sys.prefix)
          dst=pathlib.Path('dist/host/runtime/python')
          shutil.copytree(src,dst,dirs_exist_ok=True)
          print('portable python source',src)
          print('portable python destination',dst)
          '@ | python
          dist/host/runtime/python/python.exe -c "import torch,platform; print('Python',platform.python_version(),'PyTorch',torch.__version__,'tensor',torch.tensor([1.0]).sum().item())" | Tee-Object -FilePath dist/PYTORCH_RUNTIME_VERIFY.txt

      - name: Add native WALMI start scripts and writable growth layout
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "PATH=%CD%\runtime\python;%CD%\runtime\python\Scripts;%PATH%"
          set "PYTHONHOME=%CD%\runtime\python"
          set "WALMI_HOME=%CD%"
          echo WALMI PC FULL STACK
          echo Local Go + Python + PyTorch runtime loaded from this folder.
          echo.
          bin\waldo.exe advisor WALMI
          if errorlevel 1 (
            echo.
            echo WALDO advisor exited. Opening WALMI local shell.
            cmd /k "echo Try bin\waldo.exe --help and bin\waldo.exe mirror --help"
          )
          '@ | Set-Content -Encoding ascii dist/host/START_WALMI_PC.cmd
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "PATH=%CD%\runtime\python;%CD%\runtime\python\Scripts;%PATH%"
          set "PYTHONHOME=%CD%\runtime\python"
          set "WALMI_HOME=%CD%"
          cmd /k "echo WALMI local shell ready. Try bin\waldo.exe mirror --help"
          '@ | Set-Content -Encoding ascii dist/host/WALMI_LOCAL_SHELL.cmd
          Copy-Item dist/import/inventory/MODEL_WEIGHT_SCAN.json dist/host/
          Copy-Item dist/WINDOWS_RUNTIME_PATCH_RECEIPT.json dist/host/
          Copy-Item LICENSE,NOTICE dist/host/
          @'
          WALMI PC FULL STACK v0.1

          1. Run START_WALMI_PC.cmd.
          2. The bundled Python/PyTorch runtime is selected through PATH/PYTHONHOME.
          3. models/, checkpoints/, experience/, rollback/, and state/ are local writable growth locations.

          This package contains the complete current code stack and complete experiment Git history in the OUTER WALMI cartridge.
          MODEL_WEIGHT_SCAN.json states whether the source repository already contained trained weights. If count=0, no weights were invented.
          '@ | Set-Content -Encoding utf8 dist/host/README_FIRST.txt

      - name: Verify relocated portable runtime and native host
        shell: pwsh
        run: |
          dist/host/runtime/python/python.exe -c "import torch; assert torch.tensor([2.0]).sum().item()==2.0"
          dist/host/bin/waldo.exe --version
          dist/host/bin/waldo.exe mirror --help | Out-Null
          if (-not (Test-Path dist/host/models)) { throw 'models directory missing' }
          if (-not (Test-Path dist/host/checkpoints)) { throw 'checkpoints directory missing' }
          if (-not (Test-Path dist/host/experience)) { throw 'experience directory missing' }
          if (-not (Test-Path dist/host/rollback)) { throw 'rollback directory missing' }

      - name: Package native Windows full host
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root=Path('dist/host')
          out=Path('dist/cartridge/native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  z.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
          print('native host bytes',out.stat().st_size)

      - name: Build browser fallback and assemble full cartridge
        shell: pwsh
        run: |
          $env:GOOS='js'; $env:GOARCH='wasm'
          go build -trimpath -ldflags='-s -w' -o dist/cartridge/runtime/go/walmi-axm-mirror.wasm ./cmd/walmi-browser-wasm
          Remove-Item Env:GOOS; Remove-Item Env:GOARCH
          $wasmExec=(Get-ChildItem (go env GOROOT) -Recurse -Filter wasm_exec.js | Select-Object -First 1).FullName
          if (-not $wasmExec) { throw 'wasm_exec.js missing' }
          Copy-Item $wasmExec dist/cartridge/runtime/go/wasm_exec.js
          Copy-Item portable/walmi-browser-cartridge/runtime/browser-entry.js dist/cartridge/runtime/browser-entry.js
          Copy-Item -Recurse dist/import/inventory dist/cartridge/inventory
          Copy-Item -Recurse dist/import/source dist/cartridge/source
          Copy-Item -Recurse dist/import/history dist/cartridge/history
          Copy-Item dist/WINDOWS_RUNTIME_PATCH_RECEIPT.json,dist/WALDO_WINDOWS_VERSION.txt,dist/WALDO_WINDOWS_MIRROR_HELP.txt,dist/PYTORCH_RUNTIME_VERIFY.txt dist/cartridge/inventory/
          Copy-Item LICENSE,NOTICE dist/cartridge/

      - name: Write cartridge manifest and final byte inventory
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib
          root=Path('dist/cartridge')
          native=root/'native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip'
          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()
          weight=json.loads((root/'inventory/MODEL_WEIGHT_SCAN.json').read_text())
          audit=json.loads((root/'inventory/EXPERIMENT_STACK_AUDIT.json').read_text())
          manifest={
            'schema':'walmi.cartridge/v1',
            'name':'WALMI-PC-FULL-STACK',
            'version':'0.1.0',
            'browserEntry':'runtime/browser-entry.js',
            'source':{
              'repository':'mike-axiom-mir/waldo-axm-mirror-research',
              'walmiBaseCommit':'c6011afbb456b8fe1e6c7c6eda7857aec681cb8f',
              'currentStackArchive':'source/WALMI_CURRENT_STACK_c6011af.zip',
              'allExperimentHistory':'history/WALDO_ALL_EXPERIMENTS.bundle',
              'experimentBranchesAudited':audit['mirrorWaldoBranchCount']
            },
            'stack':['MIRROR','WALDO','HERMES','EPHEMERAL_SPECIALISTS','NEURAL_SOCKETS','DETERMINIZATION_STEWARD','WORKSHOP_CAPABILITY_INTAKE','SERVICE_MODES','GRAMMAR_GLASS','CREATION_FABRIC','PR67_OBJECT_ADAPTER','PR68_RECORD_QUERY'],
            'nativeHosts':[{'platform':'windows','arch':'x64','label':'WALMI Windows Full Host','path':'native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip','fileName':'WALMI_WINDOWS_FULL_HOST_v0_1.zip','sha256':sha(native)}],
            'runtime':{
              'go':{'target':'js/wasm','wasm':'runtime/go/walmi-axm-mirror.wasm','exec':'runtime/go/wasm_exec.js','targetNeedsGoInstalled':False},
              'windows':{'portablePython':True,'portablePyTorchCPU':True,'targetNeedsPythonInstalled':False,'trainingAndInferenceCodeBundled':True},
              'neural':{'startingWeightsBundled':weight['startingWeightsBundled'],'weightFiles':weight['recognizedWeightFiles'],'internetFallback':False}
            },
            'experienceExport':True,
            'rollbackStorage':True,
            'offlineRequired':True,
            'authority':'NONE'
          }
          (root/'walmi.manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          (root/'README_FIRST.txt').write_text('WALMI PC FULL STACK v0.1\n\nOpen the single WALMI HTML launcher on PC, load this ZIP, and choose FULL STRENGTH. It extracts the bundled Windows host ZIP. Extract that host ZIP and run START_WALMI_PC.cmd.\n\nSee inventory/EXPERIMENT_STACK_AUDIT.json, MODEL_WEIGHT_SCAN.json, and CARTRIDGE_FILE_MANIFEST.json for exact completeness evidence.\n',encoding='utf-8')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rows.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':sha(p)})
          (root/'inventory/CARTRIDGE_FILE_MANIFEST.json').write_text(json.dumps({'schema':'walmi.cartridge-files/v1','count':len(rows),'files':rows},indent=2),encoding='utf-8')
          required=['walmi.manifest.json','runtime/browser-entry.js','runtime/go/walmi-axm-mirror.wasm','runtime/go/wasm_exec.js','native/windows/WALMI_WINDOWS_FULL_HOST_v0_1.zip','source/WALMI_CURRENT_STACK_c6011af.zip','history/WALDO_ALL_EXPERIMENTS.bundle','inventory/EXPERIMENT_STACK_AUDIT.json','inventory/MODEL_WEIGHT_SCAN.json','inventory/UNMODIFIED_VERIFICATION.json','inventory/WINDOWS_RUNTIME_PATCH_RECEIPT.json']
          missing=[p for p in required if not (root/p).is_file()]
          if missing or not audit['allCriticalPresent']:
              raise SystemExit('FINAL_COMPLETENESS_AUDIT_FAILED '+repr(missing))
          print('FINAL COMPLETENESS AUDIT PASS',len(rows),'files before file-manifest self-entry')

      - name: Create final WALMI PC ZIP and test every ZIP member
        shell: python
        run: |
          from pathlib import Path
          import zipfile, hashlib
          root=Path('dist/cartridge')
          out=Path('dist/WALMI_PC_FULL_STACK_v0_1.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  z.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(out) as z:
              bad=z.testzip()
              if bad: raise SystemExit('BAD_ZIP_MEMBER '+bad)
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('dist/WALMI_PC_FULL_STACK_v0_1.sha256.txt').write_text(h+'  '+out.name+'\n',encoding='utf-8')
          print('FINAL WALMI PC ZIP',out.stat().st_size,h)

      - name: Upload full PC cartridge
        uses: actions/upload-artifact@v4
        with:
          name: WALMI-PC-FULL-STACK-v0-1
          path: |
            dist/WALMI_PC_FULL_STACK_v0_1.zip
            dist/WALMI_PC_FULL_STACK_v0_1.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
