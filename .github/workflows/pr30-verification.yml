name: pr30-verification

on:
  push:
    branches:
      - axm/mirror-waldo-experiment-v0.51-website-creation-loop
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply narrow deterministic diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pr30-verification/changed
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/cli/export_test.go")
          text = path.read_text()
          needle = '\tnewCompose.Stages[0].Corpora = model.NewCorpusSelections([]string{"books"})\n'
          replacement = needle + '\tcheckpointEvery := int64(1)\n\tnewCompose.Stages[0].Parameters.CheckpointEvery = &checkpointEvery\n'
          if needle not in text:
              raise SystemExit("checkpoint fixture insertion point not found")
          if "newCompose.Stages[0].Parameters.CheckpointEvery" not in text:
              text = text.replace(needle, replacement, 1)
          old = '\t\tt.Fatalf("fresh advisor chat = %s, err = %v", chat, err)\n'
          new = '\t\tt.Fatalf("fresh advisor chat = %s, err = %v, stdout = %q, stderr = %q", chat, err, stdout.String(), stderr.String())\n'
          if old not in text:
              raise SystemExit("fresh advisor assertion not found")
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/cli/export_test.go
          gofmt -l . | tee .pr30-verification/gofmt-before.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            gofmt -w "$file"
          done < .pr30-verification/gofmt-before.txt
          git diff -- . ':(exclude).github/workflows/pr30-verification.yml' > .pr30-verification/verification.patch
          cat .pr30-verification/verification.patch
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p ".pr30-verification/changed/$(dirname "$file")"
            cp "$file" ".pr30-verification/changed/$file"
          done < <(git diff --name-only -- . ':(exclude).github/workflows/pr30-verification.yml')
          printf 'source_head=%s\n' "$GITHUB_SHA" > .pr30-verification/context.txt
      - name: Inventory mutable CLI test state
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -E 'modelAdvisor(Ask|Input|Terminal)|terminalOutputWidth|os\.Chdir|t\.Parallel\(\)' internal/cli/*_test.go \
            | tee .pr30-verification/global-test-state.txt || true
          go test ./internal/cli -list . | tee .pr30-verification/test-list.txt
      - name: Run complete CLI package with ordering evidence
        shell: bash
        run: |
          set +e
          set -o pipefail
          go test ./internal/cli -count=1 -v 2>&1 | tee .pr30-verification/cli-all.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > .pr30-verification/cli-all-exit-status.txt
          exit "$status"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr30-verification-evidence
          path: .pr30-verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
