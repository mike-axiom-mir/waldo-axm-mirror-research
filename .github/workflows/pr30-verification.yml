name: pr30-verification

on:
  push:
    branches:
      - axm/mirror-waldo-experiment-v0.51-website-creation-loop
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply narrow lifecycle-race candidate repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pr30-verification/changed
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/cli/advisor.go")
          text = path.read_text()

          old = "\t\tvar report model.Advice\n\t\tvar err error\n"
          new = "\t\tvar report model.Advice\n\t\tvar buildHistory []advisorBuildSummary\n\t\tvar composeHistory []string\n\t\tvar err error\n"
          if old not in text:
              raise SystemExit("monitor declaration insertion point not found")
          text = text.replace(old, new, 1)

          old = "\t\t\treport, err = currentAdvisorEvidence(monitor.root, monitor.name)\n\t\t\tif err == nil {\n\t\t\t\tbreak\n\t\t\t}\n"
          new = "\t\t\treport, err = currentAdvisorEvidence(monitor.root, monitor.name)\n\t\t\tif err == nil {\n\t\t\t\tbuildHistory, composeHistory, err = currentAdvisorBuildHistory(monitor.root, monitor.name)\n\t\t\t}\n\t\t\tif err == nil {\n\t\t\t\tbreak\n\t\t\t}\n"
          if old not in text:
              raise SystemExit("monitor retry body not found")
          text = text.replace(old, new, 1)

          old = "\t\tbuildHistory, composeHistory, err := currentAdvisorBuildHistory(monitor.root, monitor.name)\n\t\tif err != nil {\n\t\t\tfmt.Fprintf(monitor.warnings, \"warning: advisor checkpoint monitor: %v\\n\", err)\n\t\t\tcontinue\n\t\t}\n"
          if old not in text:
              raise SystemExit("unretried build-history block not found")
          text = text.replace(old, "", 1)
          path.write_text(text)
          PY
          gofmt -w internal/cli/advisor.go internal/axmmirror/experience_training_review.go
          git diff -- . ':(exclude).github/workflows/pr30-verification.yml' > .pr30-verification/verification.patch
          cat .pr30-verification/verification.patch
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p ".pr30-verification/changed/$(dirname "$file")"
            cp "$file" ".pr30-verification/changed/$file"
          done < <(git diff --name-only -- . ':(exclude).github/workflows/pr30-verification.yml')
          printf 'source_head=%s\n' "$GITHUB_SHA" > .pr30-verification/context.txt
          test -z "$(gofmt -l .)"
      - name: Stress complete CLI package
        shell: bash
        run: |
          set +e
          set -o pipefail
          go test ./internal/cli -count=10 2>&1 | tee .pr30-verification/cli-stress.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > .pr30-verification/cli-stress-exit-status.txt
          exit "$status"
      - name: Run complete repository suite
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./testing/all.sh 2>&1 | tee .pr30-verification/all.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > .pr30-verification/all-exit-status.txt
          exit "$status"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr30-verification-evidence
          path: .pr30-verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
